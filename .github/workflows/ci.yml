name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile
      - name: Verify Bun pin and clean install
        run: |
          expected=$(node -p "require('./package.json').packageManager.split('@')[1]")
          actual=$(bun --version)
          echo "packageManager Bun: $expected, installed Bun: $actual"
          if [ "$actual" != "$expected" ]; then exit 1; fi
          status=$(git status --porcelain)
          echo "$status"
          if [ -n "$status" ]; then exit 1; fi
      - name: Build
        run: bun run build
  lint:
    name: Lint

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile
      - name: Verify Bun pin and clean install
        run: |
          expected=$(node -p "require('./package.json').packageManager.split('@')[1]")
          actual=$(bun --version)
          echo "packageManager Bun: $expected, installed Bun: $actual"
          if [ "$actual" != "$expected" ]; then exit 1; fi
          status=$(git status --porcelain)
          echo "$status"
          if [ -n "$status" ]; then exit 1; fi
      - name: Lint
        run: bun run lint
  style:
    name: Check style

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile
      - name: Verify Bun pin and clean install
        run: |
          expected=$(node -p "require('./package.json').packageManager.split('@')[1]")
          actual=$(bun --version)
          echo "packageManager Bun: $expected, installed Bun: $actual"
          if [ "$actual" != "$expected" ]; then exit 1; fi
          status=$(git status --porcelain)
          echo "$status"
          if [ -n "$status" ]; then exit 1; fi
      - name: Check style
        run: bun run format
  test:
    name: Run unit tests

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile
      - name: Verify Bun pin and clean install
        run: |
          expected=$(node -p "require('./package.json').packageManager.split('@')[1]")
          actual=$(bun --version)
          echo "packageManager Bun: $expected, installed Bun: $actual"
          if [ "$actual" != "$expected" ]; then exit 1; fi
          status=$(git status --porcelain)
          echo "$status"
          if [ -n "$status" ]; then exit 1; fi
      - name: Run tests
        run: bun run test:coverage
      - name: Submit test coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/server/coverage/clover.xml
          fail_ci_if_error: true
